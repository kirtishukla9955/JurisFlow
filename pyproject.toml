[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jurisflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "psycopg2-binary",
    "celery",
    "redis",
    "playwright",
    "scipy",
    "numpy",
    "streamlit",
    "prometheus-client",
    "pydantic-settings",
    "pytest",
    "pytest-asyncio",
    "httpx"
]
